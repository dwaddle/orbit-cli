[package]
name = "orbit-cli"
version = "0.2.0"
edition = "2021"
authors = ["Rene <dwaddle@users.noreply.github.com>"]
description = "Lightweight, high-performance terminal AI coding agent in Rust powered by OpenRouter with MCP tool calling, Vim TUI, subagents, and streaming REPL"
license = "MIT"
repository = "https://github.com/dwaddle/orbit-cli"
homepage = "https://github.com/dwaddle/orbit-cli"
readme = "README.md"
keywords = ["ai", "agent", "mcp", "openrouter", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
rustyline = "14.0"
colored = "2.1"
dirs = "5.0"
anyhow = "1.0"
eventsource-stream = "0.2"
regex = "1.10"
ratatui = "0.30.2"
crossterm = "0.29.0"
notify = "6.1"
ignore = "0.4"
fuzzy-matcher = "0.3"

[dev-dependencies]
tempfile = "3.10"
