[package]
name = "orbit-cli"
version = "0.1.0"
edition = "2021"
description = "Lightweight, high-performance terminal AI coding agent in Rust powered by OpenRouter with MCP tool calling, subagents, and streaming REPL"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
rustyline = "14.0"
colored = "2.1"
dirs = "5.0"
anyhow = "1.0"
eventsource-stream = "0.2"
regex = "1.10"
ratatui = "0.30.2"
crossterm = "0.29.0"
notify = "6.1"
