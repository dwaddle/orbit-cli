name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="orbit-cli-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist/docs
          cp "target/${{ matrix.target }}/release/orbit-cli" dist/orbit-cli
          ln -s orbit-cli dist/orbit
          cp README.md MANUAL.md LICENSE dist/
          cp docs/MANUAL_NL.md dist/docs/
          tar -C dist -czf "${ARCHIVE}" orbit-cli orbit README.md MANUAL.md LICENSE docs/MANUAL_NL.md
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" || shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            orbit-cli-*.tar.gz
            orbit-cli-*.tar.gz.sha256
