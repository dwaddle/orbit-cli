    <text x="0" y="88" class="yellow" font-weight="bold">▶ 📄 src/mcp.rs</text>
    <text x="0" y="110" class="white">  📄 src/main.rs</text>
    <text x="0" y="132" class="white">  📄 src/tui.rs</text>
    <text x="0" y="154" class="white">  📄 src/compile_guard.rs</text>
    <text x="0" y="176" class="white">  📄 src/patch.rs</text>
    <text x="0" y="198" class="white">  📄 src/routing.rs</text>
    <text x="0" y="220" class="white">  📄 src/subagent.rs</text>
    <text x="0" y="242" class="white">  📄 src/review.rs</text>
    <text x="0" y="264" class="white">  📄 src/tdd.rs</text>
    <text x="0" y="286" class="white">  📄 Cargo.toml</text>
    <text x="0" y="308" class="white">  📄 MANUAL.md</text>
    <text x="0" y="330" class="white">  📄 README.md</text>
  </g>

  <!-- Right Top Pane: Active Subagents & MCP Status -->
  <rect x="292" y="82" width="776" height="90" rx="4" fill="#0d1117" class="border-blue"/>
  <rect x="304" y="75" width="265" height="14" fill="#0d1117"/>
  <text x="310" y="85" class="title white">🤖 Subagents &amp; MCP Servers (7 Active)</text>
  <g transform="translate(308, 106)" class="mono">
    <text x="0" y="0" class="green">✓ [MCP] system-watchdog (6 tools)   ✓ [MCP] code-quality-auditor (9 tools)   ✓ [MCP] org-life-mcp (4 tools)</text>
    <text x="0" y="22" class="green">✓ [DAG #1] security-audit (COMPLETED)  ──►  ✓ [DAG #2] perf-analysis (COMPLETED)</text>
    <text x="0" y="44" class="cyan">⚡ [CompileGuard] cargo check passed in 180ms | Prompt Cache: 89% hit rate (ephemeral)</text>
  </g>

  <!-- Right Middle Pane: Streaming Conversation -->
  <rect x="292" y="180" width="776" height="320" rx="4" fill="#0d1117" class="border-blue"/>
  <rect x="304" y="173" width="250" height="14" fill="#0d1117"/>
  <text x="310" y="183" class="title white">💬 Conversation [lines 12-28/28]</text>

  <g transform="translate(308, 206)" class="mono">
    <text x="0" y="0" class="cyan" font-weight="bold">👤 You: Check pacnew files via MCP and patch the JSON-RPC handshake in src/mcp.rs</text>
    <text x="0" y="26" class="yellow" font-weight="bold">⚙️  Executing tool: audit_pacnew_files (MCP: system-watchdog) ──► 0 .pacnew files found</text>
    <text x="0" y="48" class="yellow" font-weight="bold">⚙️  Executing tool: apply_patch on src/mcp.rs ──► [CompileGuard: OK]</text>
    <text x="0" y="74" class="green" font-weight="bold">🛰️ Orbit:</text>
    <text x="80" y="74" class="white">Both tasks completed. Sent the MCP 2024-11-05 initialized notification:</text>

    <!-- Framed Code Block -->
    <text x="0" y="100" class="blue">╭─── [rust] src/mcp.rs ──────────────────────────────────────────────────────────</text>
    <text x="0" y="120" class="blue">│ </text><text x="18" y="120" class="magenta">let</text><text x="48" y="120" class="white"> init_notif = </text><text x="155" y="120" class="cyan">json!</text><text x="195" y="120" class="white">({ </text><text x="218" y="120" class="green">"jsonrpc"</text><text x="292" y="120" class="white">: </text><text x="308" y="120" class="green">"2.0"</text><text x="350" y="120" class="white">, </text><text x="366" y="120" class="green">"method"</text><text x="432" y="120" class="white">: </text><text x="448" y="120" class="green">"notifications/initialized"</text><text x="670" y="120" class="white"> });</text>
    <text x="0" y="140" class="blue">│ </text><text x="18" y="140" class="magenta">if let</text><text x="72" y="140" class="cyan"> Some</text><text x="112" y="140" class="white">(stdin) = </text><text x="192" y="140" class="orange">self</text><text x="225" y="140" class="white">.child.stdin.</text><text x="330" y="140" class="cyan">as_mut</text><text x="380" y="140" class="white">() {</text>
    <text x="0" y="160" class="blue">│ </text><text x="50" y="160" class="white">stdin.</text><text x="98" y="160" class="cyan">write_all</text><text x="172" y="160" class="white">(init_notif.</text><text x="268" y="160" class="cyan">to_string</text><text x="342" y="160" class="white">().</text><text x="366" y="160" class="cyan">as_bytes</text><text x="432" y="160" class="white">()).</text><text x="464" y="160" class="magenta">await</text><text x="505" y="160" class="white">?;</text>
    <text x="0" y="180" class="blue">│ </text><text x="18" y="180" class="white">}</text>
    <text x="0" y="200" class="blue">╰────────────────────────────────────────────────────────────────────────────────</text>

    <text x="0" y="226" class="white">All 7 MCP servers and 31 tools are registered and ready. Use </text>
    <text x="495" y="226" class="cyan" font-weight="bold">/undo</text>
    <text x="542" y="226" class="white"> to revert at any time.</text>
  </g>

  <!-- Right Bottom Pane: Prompt Input -->
  <rect x="292" y="508" width="776" height="68" rx="4" fill="#0d1117" class="border-green"/>
  <rect x="304" y="501" width="490" height="14" fill="#0d1117"/>
  <text x="310" y="511" class="title green">⌨️ Prompt Input [INSERT] (Enter=Send, \=Multi-Line, Esc=Normal)</text>
  <text x="308" y="546" class="mono white">/tdd Implement exponential backoff retry logic in src/routing.rs</text>
  <rect x="822" y="533" width="9" height="16" class="cursor"/>

  <!-- Bottom Status Bar -->
  <rect x="12" y="584" width="76" height="24" rx="3" fill="#56d364"/>
  <text x="50" y="600" text-anchor="middle" class="badge" fill="#0d1117">INSERT</text>
  <text x="102" y="600" class="mono white">Pane: </text>
  <text x="150" y="600" class="mono cyan" font-weight="bold">Input</text>
  <text x="205" y="600" class="mono white">| Enter: Send | \+Enter: Multi-Line | Esc: Normal Mode | Tab: Switch Pane | /mcp /undo /dag</text>
</svg>
