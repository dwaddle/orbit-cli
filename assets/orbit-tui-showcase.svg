<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .title { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: bold; }
      .badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; }
      .cyan { fill: #39c5cf; }
      .green { fill: #56d364; }
      .yellow { fill: #e3b341; }
      .magenta { fill: #d2a8ff; }
      .blue { fill: #58a6ff; }
      .white { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .orange { fill: #ffa657; }
      .border-cyan { stroke: #39c5cf; stroke-width: 1.5; fill: none; rx: 4; }
      .border-green { stroke: #56d364; stroke-width: 1.8; fill: none; rx: 4; }
      .border-blue { stroke: #58a6ff; stroke-width: 1.2; fill: none; rx: 4; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; fill: #56d364; }
    </style>
  </defs>

  <!-- Outer Terminal Window -->
  <rect width="1080" height="620" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Window Title Bar -->
  <rect width="1080" height="34" rx="10" fill="#161b22"/>
  <line x1="0" y1="34" x2="1080" y2="34" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="540" y="22" text-anchor="middle" class="title white">orbit-cli --tui — ~/projecten/orbit-cli (v0.2.0)</text>

  <!-- Top Header Bar -->
  <rect x="12" y="42" width="1056" height="32" rx="4" fill="#0d1117" class="border-cyan"/>
  <rect x="120" y="35" width="380" height="14" fill="#0d1117"/>
  <text x="126" y="45" class="title cyan">Orbit Autonomous Workspace TUI (Vi-Modal)</text>
  <text x="24" y="63" class="mono cyan" font-weight="bold">🛰️ ORBIT TUI</text>
  <text x="135" y="63" class="mono white">| Model: </text>
  <text x="205" y="63" class="mono green" font-weight="bold">anthropic/claude-sonnet-4.5</text>
  <text x="440" y="63" class="mono white">| Tools: </text>
  <text x="505" y="63" class="mono green" font-weight="bold">11 Built-in + 7 MCP Servers</text>
  <text x="745" y="63" class="mono white">| Guard: </text>
  <text x="815" y="63" class="mono yellow" font-weight="bold">AST + Self-Heal</text>

  <!-- Left Pane: Workspace Files -->
  <rect x="12" y="82" width="270" height="494" rx="4" fill="#0d1117" class="border-blue"/>
  <rect x="24" y="75" width="175" height="14" fill="#0d1117"/>
  <text x="30" y="85" class="title white">📁 Workspace Files (16)</text>

  <g transform="translate(24, 108)" class="mono">
    <text x="0" y="0" class="cyan" font-weight="bold">  📁 .github/workflows/</text>
    <text x="0" y="22" class="cyan" font-weight="bold">  📁 docs/</text>
    <text x="0" y="44" class="cyan" font-weight="bold">  📁 packaging/aur/</text>
    <text x="0" y="66" class="cyan" font-weight="bold">  📁 src/</text>
